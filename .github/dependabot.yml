version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      # Routine minor/patch bumps arrive as one weekly PR; majors stay separate.
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      # Security fixes that land together are bundled into one PR.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
